version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # The workflows pin actions to commit SHAs; this keeps them current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
